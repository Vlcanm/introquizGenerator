<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イントロクイズ楽曲ジェネレーター</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; }
        select, input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { grid-column: span 2; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        .retry-btn { background-color: #e67e22; margin-top: 10px; display: none; }
        .retry-btn:hover { background-color: #d35400; }
        #results { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .song-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .song-num { font-weight: bold; color: #7f8c8d; margin-right: 10px; }
        .copyright-notice { margin-top: 40px; font-size: 12px; color: #95a5a6; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Intro Quiz Generator</h1>
    
    <div class="controls">
        <div class="form-group">
            <label>生成する曲数 (10-100)</label>
            <input type="number" id="songCount" value="10" min="10" max="100">
        </div>
        <div class="form-group">
            <label>ジャンル</label>
            <select id="genreSelect">
                <option value="all">すべて</option>
                <option value="J-POP">J-POP</option>
                <option value="K-POP">K-POP</option>
                <option value="Pop">Pop</option>
                <option value="Rock">Rock</option>
                <option value="Heavy Metal">Heavy Metal</option>
                <option value="Hip Hop">Hip Hop</option>
                <option value="ボカロ">ボカロ</option>
                <option value="EDM">EDM</option>
            </select>
        </div>
        <div class="form-group">
            <label>ターゲット層 (年代別流行曲)</label>
            <select id="ageSelect">
                <option value="any">指定なし</option>
                <option value="elementary">小学生</option>
                <option value="junior-high">中学生</option>
                <option value="high-school">高校生</option>
                <option value="university">大学生</option>
            </select>
        </div>
        <button onclick="generateList()">リストを生成する</button>
        <button id="retryBtn" class="retry-btn" onclick="generateList()">別の曲でリトライ</button>
    </div>

    <div id="results"></div>

    <div class="copyright-notice">
        ※本ツールは選曲の提案のみを行います。音源の再生には、公式のストリーミングサービスやCD等をご利用ください。<br>
        © 2026 Intro Quiz Helper
    </div>
</div>

<script>
// サンプル楽曲データベース (ここを増やすことでバリエーションが豊かになります)
const songDatabase = [
    { title: "アイドル", artist: "YOASOBI", genre: "J-POP", ages: ["elementary", "junior-high", "high-school", "university"] },
    { title: "Bling-Bang-Bang-Born", artist: "Creepy Nuts", genre: "Hip Hop", ages: ["elementary", "junior-high", "high-school"] },
    { title: "Dynamite", artist: "BTS", genre: "K-POP", ages: ["junior-high", "high-school", "university"] },
    { title: "千本桜", artist: "黒うさP", genre: "ボカロ", ages: ["elementary", "junior-high"] },
    { title: "Master of Puppets", artist: "Metallica", genre: "Heavy Metal", ages: ["university"] },
    { title: "Shape of You", artist: "Ed Sheeran", genre: "Pop", ages: ["high-school", "university"] },
    { title: "Pretender", artist: "Official髭男dism", genre: "J-POP", ages: ["high-school", "university"] },
    { title: "怪獣の花唄", artist: "Vaundy", genre: "Rock", ages: ["high-school", "university"] },
    { title: "唱", artist: "Ado", genre: "J-POP", ages: ["elementary", "junior-high", "high-school"] },
    { title: "Levels", artist: "Avicii", genre: "EDM", ages: ["university"] },
    { title: "Ditto", artist: "NewJeans", genre: "K-POP", ages: ["high-school", "university"] },
    { title: "God knows...", artist: "涼宮ハルヒ", genre: "Rock", ages: ["university"] },
    // ... 必要に応じて数百曲レベルで追加可能
];

function generateList() {
    const count = parseInt(document.getElementById('songCount').value);
    const genre = document.getElementById('genreSelect').value;
    const age = document.getElementById('ageSelect').value;
    const resultsDiv = document.getElementById('results');
    const retryBtn = document.getElementById('retryBtn');

    // フィルタリング
    let filtered = songDatabase.filter(song => {
        const genreMatch = (genre === 'all' || song.genre === genre);
        const ageMatch = (age === 'any' || song.ages.includes(age));
        return genreMatch && ageMatch;
    });

    // 楽曲が足りない場合のダミー補填 (実際はデータベースを充実させる)
    while (filtered.length < count && filtered.length > 0) {
        filtered = [...filtered, ...filtered]; 
    }

    // シャッフル
    const shuffled = filtered.sort(() => 0.5 - Math.random());
    const selected = shuffled.slice(0, count);

    // 表示
    resultsDiv.innerHTML = `<h3>生成結果 (${selected.length}曲)</h3>`;
    if (selected.length === 0) {
        resultsDiv.innerHTML += "<p>条件に合う曲が見つかりませんでした。</p>";
    } else {
        selected.forEach((song, index) => {
            resultsDiv.innerHTML += `
                <div class="song-item">
                    <span><span class="song-num">${index + 1}</span> ${song.title}</span>
                    <span style="color: #95a5a6;">${song.artist} (${song.genre})</span>
                </div>
            `;
        });
        retryBtn.style.display = 'block';
    }
}
</script>

</body>
</html>
